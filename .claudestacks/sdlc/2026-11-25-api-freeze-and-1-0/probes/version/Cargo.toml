[package]
name = "probe-version"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
semver = "=1.0.28"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

[workspace]
