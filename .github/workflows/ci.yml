name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref supersedes whatever is still running for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are dead weight in a fresh runner and only bloat the cache.
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

jobs:
  dod:
    name: Definition of Done
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # `rustup toolchain install` with no argument installs the toolchain that
      # rust-toolchain.toml names; since rustup 1.28 a bare `rustup show` no longer
      # does. The pin is an exact patch release, so the runner's preinstalled stable
      # never satisfies it and this step always downloads a toolchain — the version
      # numbers printed below are the record of which one the gate actually ran on.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      # tests/runtime.rs runs the shipped hook runtime on the real binary. The
      # prebuilt release is downloaded rather than compiled, and checked against
      # a hash pinned here, not one fetched from the same place. Pinned to the
      # version the runtime was proven on, the same as the airsl library in
      # Cargo.toml; bump the version, the hash and the library together. The
      # `opencode-check` job carries a second copy of the version and hash:
      # bump both jobs.
      - name: Install the airsl binary
        env:
          AIRSL_VERSION: 0.1.5
          AIRSL_SHA256: a8a8f9e527c20fc6bd61fcdb07cc7ce6eb1a9ea0100c1a1706b60a87aab83006
        run: |
          target=airsl-cli-x86_64-unknown-linux-gnu
          curl -sSfL -o "$RUNNER_TEMP/airsl.tar.xz" \
            "https://github.com/airsstack/airsl/releases/download/airsl-cli-v${AIRSL_VERSION}/${target}.tar.xz"
          echo "${AIRSL_SHA256}  $RUNNER_TEMP/airsl.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xJf "$RUNNER_TEMP/airsl.tar.xz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${target}/airsl" "$HOME/.local/bin/airsl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/airsl" --version

      # One command, the same one a developer runs locally: fmt-check, clippy,
      # rustdoc, tests, doctests — each with warnings as errors.
      # AGENTSTACKS_REQUIRE_AIRSL makes the runtime tests fail, not skip, if the
      # binary above is missing.
      - name: cargo make dod
        run: cargo make dod
        env:
          AGENTSTACKS_REQUIRE_AIRSL: "1"

  claudevs-check:
    name: claudevs fixture corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Same step as in the `dod` job: the pinned toolchain from rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      # No `claude` binary on the runner: the validate stage reports itself
      # skipped and the deterministic stages gate.
      - name: cargo make claudevs-check
        run: cargo make claudevs-check

  opencode-check:
    name: OpenCode check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Same step as in the `dod` job: the pinned toolchain from rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      # Same step as in the `dod` job: the pinned airsl binary, which the hooks
      # the check drives run under. This copy of the version and hash is bumped
      # together with the one in the `dod` job.
      - name: Install the airsl binary
        env:
          AIRSL_VERSION: 0.1.5
          AIRSL_SHA256: a8a8f9e527c20fc6bd61fcdb07cc7ce6eb1a9ea0100c1a1706b60a87aab83006
        run: |
          target=airsl-cli-x86_64-unknown-linux-gnu
          curl -sSfL -o "$RUNNER_TEMP/airsl.tar.xz" \
            "https://github.com/airsstack/airsl/releases/download/airsl-cli-v${AIRSL_VERSION}/${target}.tar.xz"
          echo "${AIRSL_SHA256}  $RUNNER_TEMP/airsl.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xJf "$RUNNER_TEMP/airsl.tar.xz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${target}/airsl" "$HOME/.local/bin/airsl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/airsl" --version

      # The mock model and the scenarios are Node scripts.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Downloads the pinned OpenCode release, checks its hash, then runs the
      # scenarios against the built agentstacks binary.
      - name: cargo make opencode-check
        run: cargo make opencode-check

  deny:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Independent of the gate: this reads Cargo.lock and the advisory database,
    # compiles nothing, and finishes in seconds, so it should not wait behind a
    # build to report a licence or advisory problem.
    steps:
      - uses: actions/checkout@v5

      # cargo-deny shells out to `cargo metadata`, and `cargo` here is a rustup
      # shim that resolves rust-toolchain.toml, so the pinned toolchain gets
      # fetched either way. Doing it in its own step keeps that cost out of the
      # check's log. A bare `rustup show` would not: since rustup 1.28 it no longer
      # installs a missing toolchain.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Advisories, licences, duplicate versions and source registries. Policy
      # and every suppression live in deny.toml.
      - name: cargo deny check
        run: cargo deny check

  installers:
    name: Installer scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # All offline. For each script: it parses; with no tools on PATH it stops at
      # the missing-downloader message alone (that check runs first, and `command -v`
      # and `printf` are shell builtins, so no external tool is needed to reach it);
      # and a bad version stops at the not-a-version message. The expected text is
      # written out here, so a message that drifts from the documented one fails.
      - name: Check the installer scripts
        run: |
          check() {
            script=$1
            prefix=$2
            var=$3

            sh -n "$script"

            status=0
            env -i PATH=/nonexistent /bin/sh "$script" 2>"$RUNNER_TEMP/m1.err" || status=$?
            test "$status" -eq 1
            printf '%s: error: neither curl nor wget is installed\n' "$prefix" | diff - "$RUNNER_TEMP/m1.err"

            status=0
            env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" "$var=a/b" /bin/sh "$script" 2>"$RUNNER_TEMP/m2.err" || status=$?
            test "$status" -eq 1
            printf "%s: error: %s='a/b' is not a version (expected MAJOR.MINOR.PATCH or latest)\n" "$prefix" "$var" | diff - "$RUNNER_TEMP/m2.err"
          }

          check install/install.sh agentstacks-install AGENTSTACKS_VERSION
          check install/claudevs.sh claudevs-install CLAUDEVS_VERSION

  book:
    name: Book
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # pages.yml only builds the book after a merge, when a broken build would
    # already be on main. This is the same build, on every pull request.
    steps:
      - uses: actions/checkout@v5

      # Pinned to the versions the book is written against; keep in step with
      # pages.yml and the book tasks in Makefile.toml. mdbook-mermaid 0.16.2 is
      # the last release for mdBook 0.4.
      - name: Install mdBook and mdbook-mermaid
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.4.52,mdbook-mermaid@0.16.2

      # mdBook exits 0 when a pack chapter's include target is missing and only
      # logs an [ERROR] line, so the step fails on that line too. The same step
      # runs in pages.yml.
      - name: Build the book
        run: |
          mdbook build book > "$RUNNER_TEMP/mdbook.log" 2>&1 || { cat "$RUNNER_TEMP/mdbook.log"; exit 1; }
          cat "$RUNNER_TEMP/mdbook.log"
          if grep -q '\[ERROR\]' "$RUNNER_TEMP/mdbook.log"; then
            echo "mdbook build book logged an error; see the [ERROR] lines above" >&2
            exit 1
          fi
