name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same ref supersedes whatever is still running for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are dead weight in a fresh runner and only bloat the cache.
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: 1

jobs:
  dod:
    name: Definition of Done
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # `rustup toolchain install` with no argument installs the toolchain that
      # rust-toolchain.toml names; since rustup 1.28 a bare `rustup show` no longer
      # does. The pin is an exact patch release, so the runner's preinstalled stable
      # never satisfies it and this step always downloads a toolchain — the version
      # numbers printed below are the record of which one the gate actually ran on.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      # tests/runtime.rs runs the shipped hook runtime on the real binary. The
      # prebuilt release is downloaded rather than compiled, and checked against
      # a hash pinned here, not one fetched from the same place. Pinned to the
      # version the runtime was proven on, the same as the airsl library in
      # Cargo.toml; bump the version, the hash and the library together.
      - name: Install the airsl binary
        env:
          AIRSL_VERSION: 0.1.4
          AIRSL_SHA256: 9f64cb082b9cca15b0e9b8e9af298b6a31ccf39cbcfda81565db33093d0ad5bb
        run: |
          target=airsl-cli-x86_64-unknown-linux-gnu
          curl -sSfL -o "$RUNNER_TEMP/airsl.tar.xz" \
            "https://github.com/airsstack/airsl/releases/download/airsl-cli-v${AIRSL_VERSION}/${target}.tar.xz"
          echo "${AIRSL_SHA256}  $RUNNER_TEMP/airsl.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xJf "$RUNNER_TEMP/airsl.tar.xz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${target}/airsl" "$HOME/.local/bin/airsl"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/airsl" --version

      # One command, the same one a developer runs locally: fmt-check, clippy,
      # rustdoc, tests, doctests — each with warnings as errors.
      # AGENTSTACKS_REQUIRE_AIRSL makes the runtime tests fail, not skip, if the
      # binary above is missing.
      - name: cargo make dod
        run: cargo make dod
        env:
          AGENTSTACKS_REQUIRE_AIRSL: "1"

  claudevs-check:
    name: claudevs fixture corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Same step as in the `dod` job: the pinned toolchain from rust-toolchain.toml.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make

      # No `claude` binary on the runner: the validate stage reports itself
      # skipped and the deterministic stages gate.
      - name: cargo make claudevs-check
        run: cargo make claudevs-check

  deny:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Independent of the gate: this reads Cargo.lock and the advisory database,
    # compiles nothing, and finishes in seconds, so it should not wait behind a
    # build to report a licence or advisory problem.
    steps:
      - uses: actions/checkout@v5

      # cargo-deny shells out to `cargo metadata`, and `cargo` here is a rustup
      # shim that resolves rust-toolchain.toml, so the pinned toolchain gets
      # fetched either way. Doing it in its own step keeps that cost out of the
      # check's log. A bare `rustup show` would not: since rustup 1.28 it no longer
      # installs a missing toolchain.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Advisories, licences, duplicate versions and source registries. Policy
      # and every suppression live in deny.toml.
      - name: cargo deny check
        run: cargo deny check
