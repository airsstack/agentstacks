[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
edition       = "2024"
rust-version  = "1.94"
license       = "Apache-2.0"
repository    = "https://github.com/airsstack/agentstacks"
authors       = ["rstlix0x0 <rstlix.dev@gmail.com>"]
publish       = true

[workspace.dependencies]
agentstacks = { path = "crates/agentstacks", version = "0.2.0" }
airsl = "0.1.5"
clap = { version = "4", features = ["derive"] }
claudevs = { path = "crates/claudevs", version = "0.1.1" }
globset = "0.4"
regex = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11"
similar = "3"
tempfile = "3"
thiserror = "2"
toml = "1"
toml_edit = "0.25"
walkdir = "2.5"

[workspace.lints.rust]
unsafe_code        = "forbid"
missing_docs       = "warn"
unreachable_pub    = "warn"
unused_must_use    = "deny"

[workspace.lints.clippy]
pedantic           = { level = "warn", priority = -1 }
nursery            = { level = "warn", priority = -1 }
unwrap_used        = "deny"
expect_used        = "warn"
panic              = "deny"
todo               = "warn"
dbg_macro          = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.release]
lto                = "thin"
codegen-units      = 1
strip              = "symbols"

# The profile dist builds release archives with (`dist build` passes --profile dist).
[profile.dist]
inherits = "release"
lto      = "thin"
