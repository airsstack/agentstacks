[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
edition       = "2024"
rust-version  = "1.94"
license       = "Apache-2.0"
repository    = "https://github.com/airsstack/agentstacks"
authors       = ["rstlix0x0 <rstlix.dev@gmail.com>"]
publish       = false

[workspace.lints.rust]
unsafe_code        = "forbid"
missing_docs       = "warn"
unreachable_pub    = "warn"
unused_must_use    = "deny"

[workspace.lints.clippy]
pedantic           = { level = "warn", priority = -1 }
nursery            = { level = "warn", priority = -1 }
unwrap_used        = "deny"
expect_used        = "warn"
panic              = "deny"
todo               = "warn"
dbg_macro          = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.release]
lto                = "thin"
codegen-units      = 1
strip              = "symbols"
