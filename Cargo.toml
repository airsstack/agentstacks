[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
edition       = "2024"
rust-version  = "1.94"
license       = "Apache-2.0"
repository    = "https://github.com/airsstack/agentstacks"
authors       = ["rstlix0x0 <rstlix.dev@gmail.com>"]
publish       = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
globset = "0.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
toml = "1"

[workspace.lints.rust]
unsafe_code        = "forbid"
missing_docs       = "warn"
unreachable_pub    = "warn"
unused_must_use    = "deny"

[workspace.lints.clippy]
pedantic           = { level = "warn", priority = -1 }
nursery            = { level = "warn", priority = -1 }
unwrap_used        = "deny"
expect_used        = "warn"
panic              = "deny"
todo               = "warn"
dbg_macro          = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.release]
lto                = "thin"
codegen-units      = 1
strip              = "symbols"
