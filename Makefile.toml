#
# cargo-make task graph for the agentstacks workspace.
#
#   cargo make dod                 # the full Definition-of-Done gate
#   cargo make dod-crate <crate>   # the same steps scoped to one crate
#   cargo make fmt                 # rewrite formatting (clippy-fix is the other task that edits sources)
#   cargo make clippy              # a single gate step
#   cargo make deny                # cargo-deny; deliberately not part of dod
#   cargo make book                # serve the book locally, rebuilding on every edit
#   cargo make book-build          # build the book once into book/book/
#   cargo make --list-all-steps
#
# The five cargo gate steps mirror the canonical command set in the
# `claudestacks-guideline-rust` plugin one-for-one. Change them there first; this
# file follows. The `lua` step is the project's own addition: it compiles and tests
# the Lua under extensions/, packs/ and the conformance pack asset with `airsl check` and
# `airsl test`, runs the sdlc pack's fingerprint shell script against fixed cases, greps
# the pack sources for leftover plugin syntax and unprefixed names, fails on `api = 0`
# text in any file outside a fixed allowlist, then fails when the airsl pins of the
# ci.yml jobs differ. CI is meant to run
# `cargo make dod`, so the pipeline and a local run are the same command.
#
# Install: cargo install --locked cargo-make cargo-deny
#          plus the `airsl` binary on PATH for the `lua` step
#

[config]
# Every gate command already carries `--workspace`, so the task must run exactly
# once from the workspace root. Without this, cargo-make re-runs each task once
# per member crate — five redundant full-workspace builds.
default_to_workspace = false
# No implicit task graph. The gate is only what is written below, and a
# built-in `build`/`test`/`ci-flow` inherited from cargo-make's core set would
# run cargo commands nobody in this repo chose.
skip_core_tasks = true
min_version = "0.37.0"

[env]
CARGO_TERM_COLOR = "always"

# `--all-features` below turns on the `agentstacks` crate's `testing` feature,
# so clippy and rustdoc also check the port fakes outside `cfg(test)`.

# ---------------------------------------------------------------------------
# The gate
# ---------------------------------------------------------------------------

[tasks.default]
alias = "dod"

[tasks.dod]
category = "Gate"
description = "Definition of Done — every step must exit 0 with zero warnings"
dependencies = ["fmt-check", "clippy", "doc", "test", "test-doc", "lua"]

[tasks.fmt-check]
category = "Gate"
description = "Assert formatting without rewriting anything"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.clippy]
category = "Gate"
description = "Lint every target, warnings are errors"
# `--all-targets` covers tests, examples and benches — a lint living only in
# test code passes silently without it. `-D warnings` also promotes plain rustc
# warnings, which is why the gate has no separate `cargo build` step.
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]

[tasks.doc]
category = "Gate"
description = "Build rustdoc with warnings promoted to errors"
# Plain `cargo doc` prints rustdoc warnings and still exits 0; RUSTDOCFLAGS is
# the only thing that makes this step a gate rather than a report.
command = "cargo"
args = ["doc", "--workspace", "--all-features", "--no-deps"]

[tasks.doc.env]
RUSTDOCFLAGS = "-D warnings"

[tasks.test]
category = "Gate"
description = "Unit, integration, example and bench targets"
command = "cargo"
args = ["test", "--workspace", "--all-targets", "--all-features"]

[tasks.test-doc]
category = "Gate"
description = "Doctests — excluded by --all-targets, so they need their own run"
command = "cargo"
args = ["test", "--workspace", "--all-features", "--doc"]

[tasks.lua]
category = "Gate"
description = "Lua: airsl check and airsl test over extensions/, packs/, the conformance pack asset and scripts/release (airsl check also over the opencode-check and musecode-check packs), the fingerprint gate, the pack text gates, the api-0 gate, then the airsl pin gate"
# A shell script because the pack tests' write grant is `${TMPDIR:-/tmp}`, which
# needs shell expansion. `set -e` stops the run at the first failing step. The text
# gates at the end fail on any line their grep prints: the `if` form is needed
# because `set -e` does not fire on a negated command.
script_runner = "@shell"
script = '''
set -e
airsl check extensions
airsl check packs
airsl check crates/agentstacks/assets/conformance
airsl check scripts/release
airsl check crates/agentstacks-cli/tests/opencode-check/pack
airsl check crates/agentstacks-cli/tests/musecode-check/pack
airsl test extensions
airsl test --policy confined --allow-read / --allow-write "${TMPDIR:-/tmp}" --allow-exec git packs
airsl test crates/agentstacks/assets/conformance
airsl test scripts/release

# The fingerprint gate. `packs/sdlc/scripts/fingerprint.sh` is the one piece of
# the status board with no Lua test: it exists for machines without airsl. It
# must print exactly what `lib/fingerprint.lua` computes, and
# fingerprint_test.lua asserts these same literals on the Lua side.
FP_SH=packs/sdlc/scripts/fingerprint.sh
FP_DIR=$(mktemp -d)
trap 'rm -rf "$FP_DIR"' EXIT
FM='---\nstatus: approved\ncreated: 2026-10-13\n---\n'
BODY='# Spec: sample\n\nA line with --- inside it.\n---\nlast line'
printf '%b' "${FM}${BODY}\n" > "$FP_DIR/lf-final-newline.md"
printf '%b' "${FM}${BODY}" > "$FP_DIR/lf-no-final-newline.md"
printf '%b' "${FM}${BODY}\n" | awk '{ printf "%s\r\n", $0 }' > "$FP_DIR/crlf.md"
printf '%b' "${FM}${BODY}\n" | sed '2s/approved/done/' > "$FP_DIR/status-flipped.md"
printf '%b' "${FM}${BODY} changed\n" > "$FP_DIR/body-edited.md"
printf '%b' "${FM}" > "$FP_DIR/empty-body.md"
printf '%s\n' '# just a heading' > "$FP_DIR/no-frontmatter.md"
printf '%s\n' '---' 'status: draft' > "$FP_DIR/unterminated.md"
fail=0
FP_PATH=$PATH
check() {
  got=$(PATH="$FP_PATH" /bin/sh "$FP_SH" "$FP_DIR/$1") && code=0 || code=$?
  if [ "$got" != "$2" ] || [ "$code" != "$3" ]; then
    echo "fingerprint gate: $1: want '$2' exit $3, got '$got' exit $code" >&2
    fail=1
  fi
}
cases() {
  check lf-final-newline.md    db42cc1eff57 0
  check lf-no-final-newline.md db42cc1eff57 0
  check crlf.md                db42cc1eff57 0
  check status-flipped.md      db42cc1eff57 0
  check body-edited.md         02746658f17b 0
  check empty-body.md          e3b0c44298fc 0
  check no-frontmatter.md      ""           2
  check unterminated.md        ""           2
}
cases
[ "$fail" = 0 ] || exit 1
echo "fingerprint gate: 8 cases passed"
# fingerprint.sh prefers shasum, so where both tools exist the sha256sum
# branch never runs above. Run the cases again with a PATH holding only what
# the script needs and no shasum.
if command -v shasum >/dev/null 2>&1 && command -v sha256sum >/dev/null 2>&1; then
  mkdir "$FP_DIR/bin"
  for tool in awk cut sha256sum; do
    ln -s "$(command -v "$tool")" "$FP_DIR/bin/$tool"
  done
  FP_PATH="$FP_DIR/bin"
  cases
  [ "$fail" = 0 ] || exit 1
  echo "fingerprint gate: 8 cases passed with sha256sum"
fi

# The pack text gates. A pack is plain text rendered per tool, so the source must hold no
# Claude Code plugin syntax, no plugin-qualified names, and no bare skill, agent or command
# names that the rendered `<pack>-` prefix would break. Each grep must print nothing: its
# exit status is 1 (no match). Status 0 is a hit and status 2 or more is a grep error such as a
# missing `packs/`, which must not read as "no hit".
rc=0
grep -rnE 'CLAUDE_PLUGIN_(ROOT|OPTION)|user_config|claudestacks(-[a-z]+)*:[a-z]' packs/ --exclude=README.md --exclude='*_test.lua' || rc=$?
if [ "$rc" != 1 ]; then
  echo "pack text gate 1: plugin syntax or plugin-qualified names in packs/ (grep exit $rc)" >&2
  exit 1
fi
# Gate 2 skips the two guideline reference documents that list workflow words such as
# `reviewer` as examples of vocabulary to keep out of source comments, not as pack items.
rc=0
grep -rnE '(^|[ `"(])/(snapshot-(load|save)|journal-[a-z]+)\b|subagent_type: [a-z]|Namespaced as|`(coder|explorer|reviewer|task-briefer|chain-reader|artifact-reviewer|journal-[a-z]+|context-handoff|enforce-doctor|orchestrate|process-guidelines|snapshot-load|snapshot-save|statusline)`' packs/ --include='*.md' --exclude=README.md --exclude=doc-comment-discipline.md --exclude=docstring-discipline.md || rc=$?
if [ "$rc" != 1 ]; then
  echo "pack text gate 2: unprefixed skill, agent or command names in packs/*.md (grep exit $rc)" >&2
  exit 1
fi
# Gate 3 filters the first grep's output, so its status is read before the filter runs.
rc=0
found=$(grep -rnE 'journal-(capture|curator|note|recall|helped|link|review|setup)' packs/journal --include='*.md' --exclude=README.md) || rc=$?
if [ "$rc" -gt 1 ]; then
  echo "pack text gate 3: grep failed over packs/journal (exit $rc)" >&2
  exit 1
fi
left=$(printf '%s\n' "$found" | grep -vE ':[0-9]+:# |journal-curator-review\.md' || true)
if [ -n "$left" ]; then
  printf '%s\n' "$left"
  echo "pack text gate 3: unprefixed journal names in packs/journal/*.md" >&2
  exit 1
fi
# Gate 4 keeps neutral pack text free of one tool's tool names, events and store. It reads
# grep's status before filtering out native/<tool>/, as gate 3 does. It skips the READMEs and
# CHANGELOG.md (documentation and history), the Lua tests, the scripts that read one tool's
# own files (statusline*.lua, transcript-path.lua), and doc-comment-discipline.md, which lists
# such names as words to keep out of source comments.
rc=0
found=$(grep -rnE 'subagent_type|TodoWrite|Task / Agent|`(Agent|Task|Bash|Read|Write|Edit|MultiEdit|Grep|Glob|Skill|WebFetch|WebSearch|AskUserQuestion|NotebookEdit)`|CLAUDE_CONFIG_DIR|CLAUDE_SESSION_ID|\.claude/|transcript JSONL|SessionStart|PreToolUse|PostToolUse|SubagentStop|UserPromptSubmit' packs/ --exclude=README.md --exclude=CHANGELOG.md --exclude='*_test.lua' --exclude='statusline*.lua' --exclude=transcript-path.lua --exclude=doc-comment-discipline.md) || rc=$?
if [ "$rc" -gt 1 ]; then
  echo "pack text gate 4: grep failed over packs/ (exit $rc)" >&2
  exit 1
fi
left=$(printf '%s\n' "$found" | grep -vE '^packs/[^/]+/native/' || true)
if [ -n "$left" ]; then
  printf '%s\n' "$left"
  echo "pack text gate 4: tool-specific names in neutral pack text" >&2
  exit 1
fi
echo "pack text gates: 4 passed"

# The api-0 gate. The supported API is 1, and `api = 0` text may stay only where a file records
# the 0.x move or a legacy case on purpose (book/src/ch06-06-stability.md, book/src/ch03-01-from-0x.md):
# release history, the quoted legacy refusals, and the tests and fixtures of the 0 -> 1 move. The
# allowlist below is exact: one path per line, the files that hold such text today. A hit in any
# other file fails, so a returning `api = 0` is caught, and a new legacy file is added here on
# purpose. Untracked files count; ignored paths (target/, book/book/) do not. It reads grep's
# status before filtering, as gates 3 and 4 do.
rc=0
found=$(git grep -lE --untracked 'api *= *0|api 0|speaks 0' -- crates extensions packs book README.md CLAUDE.md RELEASING.md ':(exclude)book/book') || rc=$?
if [ "$rc" -gt 1 ]; then
  echo "api-0 gate: git grep failed (exit $rc)" >&2
  exit 1
fi
API0_KEEP="$FP_DIR/api0-keep"
cat > "$API0_KEEP" <<'KEEP'
README.md
book/src/ch03-01-from-0x.md
book/src/ch04-00-cli.md
book/src/ch05-00-plan-and-apply.md
book/src/ch06-04-pack-authoring.md
book/src/ch06-05-pack-format.md
book/src/ch06-06-stability.md
crates/agentstacks-cli/CHANGELOG.md
crates/agentstacks-cli/src/command/apply.rs
crates/agentstacks-cli/src/command/testing.rs
crates/agentstacks-cli/tests/commands.rs
crates/agentstacks-cli/tests/fixtures/legacy/agentstacks.lock
crates/agentstacks-cli/tests/fixtures/legacy/agentstacks.toml
crates/agentstacks/CHANGELOG.md
crates/agentstacks/src/app/doctor.rs
crates/agentstacks/src/app/ext/add.rs
crates/agentstacks/src/app/plan/flow.rs
crates/agentstacks/src/app/plan/read.rs
crates/agentstacks/src/app/update.rs
crates/agentstacks/src/types/api.rs
crates/agentstacks/src/types/extension/manifest.rs
crates/agentstacks/src/types/format/fields.rs
crates/agentstacks/src/types/lock/file.rs
crates/agentstacks/src/types/lock/write.rs
crates/agentstacks/src/types/manifest/error.rs
crates/agentstacks/src/types/manifest/pack/file.rs
crates/agentstacks/src/types/project/error.rs
crates/agentstacks/src/types/project/file.rs
crates/agentstacks/src/types/project/upgrade.rs
crates/agentstacks/src/types/report/phrase.rs
crates/agentstacks/tests/fixtures/extensions/invalid/api-zero/extension.toml
crates/agentstacks/tests/fixtures/packs/pack-api-legacy/pack.toml
crates/agentstacks/tests/pack.rs
packs/CHANGELOG.md
KEEP
left=$(printf '%s\n' "$found" | grep -vxFf "$API0_KEEP" | grep -v '^$' || true)
if [ -n "$left" ]; then
  printf '%s\n' "$left"
  echo "api-0 gate: api 0 text outside the allowlist in Makefile.toml (see book/src/ch06-06-stability.md)" >&2
  exit 1
fi
echo "api-0 gate: passed"

# The airsl pin gate. Each workflow job that installs the airsl binary holds its own copy of
# the pinned version and hash, so the copies must name one AIRSL_VERSION and one
# AIRSL_SHA256 across ci.yml and release-artifact.yml. It reads grep's status before filtering,
# as the gates above do.
rc=0
pins=$(grep -E '^ *AIRSL_(VERSION|SHA256): ' .github/workflows/ci.yml .github/workflows/release-artifact.yml) || rc=$?
if [ "$rc" -gt 1 ]; then
  echo "airsl pin gate: grep failed over the workflows (exit $rc)" >&2
  exit 1
fi
distinct=$(printf '%s\n' "$pins" | sed -E 's/^([A-Za-z0-9_.\/-]+\.yml:)? *//; s/ *$//' | grep -v '^$' | sort -u)
versions=$(printf '%s\n' "$distinct" | grep -c '^AIRSL_VERSION: ' || true)
hashes=$(printf '%s\n' "$distinct" | grep -c '^AIRSL_SHA256: ' || true)
if [ "$versions" != 1 ] || [ "$hashes" != 1 ]; then
  printf '%s\n' "$distinct"
  echo "airsl pin gate: the AIRSL_VERSION and AIRSL_SHA256 pins differ or are missing; give every installing job the same version and hash" >&2
  exit 1
fi
echo "airsl pin gate: passed ($(printf '%s\n' "$pins" | grep -c 'AIRSL_VERSION: ') installs)"
'''

# ---------------------------------------------------------------------------
# release discipline
# ---------------------------------------------------------------------------

[tasks.release-gate]
category = "Gate"
description = "Manifest discipline: every shipped artifact change travels with a version bump and a changelog entry, and no bump travels without one"
# Not a dependency of `dod`: dod is the five cargo commands plus the `lua`
# step. This task runs the gate's self-test fixtures, which need no
# repository state; the `release-readiness` CI job and the release workflow
# call the same script against real ranges.
script_runner = "@shell"
script = '''
set -e
sh -n scripts/release-gate.sh
sh -n scripts/release-artifact.sh
sh scripts/release-gate.sh --self-test
sh scripts/release-artifact.sh --self-test
'''

# ---------------------------------------------------------------------------
# claudevs
# ---------------------------------------------------------------------------

[tasks.claudevs-check]
category = "Claudevs"
description = "claudevs check over the fixture plugin corpus, both directions"
# Not a dependency of `dod`: the gate is the five commands the guideline skill
# owns plus the project's `lua` step. This lane asserts the checkers
# still report — a corpus of only-passing fixtures would go green the day they
# stopped. `claude` is absent on the runner, so the validate stage skips and
# the deterministic stages carry the gate, which is the documented degradation.
#
# `claude plugin validate`, run without `--strict` (the CLI's own default),
# passes bad-matcher-plugin on a machine that has `claude` installed: with
# `claude` 2.1.330 `PreToolUseX` is only a warning ("unknown hook event; entry
# ignored at runtime"), so validate reports ok and wiring is the one stage
# that FAILs for that fixture. hooks-array-plugin still fails validate there,
# and a failing stage does not stop the run, so its validate and wiring FAIL
# lines show up in one report. On the CI runner, where `claude` is absent,
# validate reports itself skipped and wiring's FAIL is the only one produced.
# Either way wiring FAILs, and that is the stage this lane asserts — so the
# deterministic wiring checkers are exercised here and on CI alike, and a
# local pass is evidence for both.
#
# Which wiring checker fails which fixture, and on what — only an Error fails
# a stage, a warning never does (crates/claudevs/src/wiring/finding.rs):
#
#   escape-plugin       refs      `${CLAUDE_PLUGIN_ROOT}/../gate.sh` escapes the plugin root
#   bad-matcher-plugin  refs      `${CLAUDE_PLUGIN_ROOT}/scripts/absent.sh` does not exist
#   hooks-array-plugin  matchers  hooks/hooks.json has no `hooks` object at the top level
#
# bad-matcher-plugin's other two findings — an unknown hook event and a
# matcher claudevs cannot compile — are warnings that `matchers` reports and
# neither fails anything: claudevs' event catalogue can lag a Claude Code
# release, and a matcher divergence is not proof the runtime would reject it
# too. So `refs` carries both of the first two FAILs, and without
# hooks-array-plugin no fixture would make `matchers` report an Error at all —
# that checker could stop reporting errors entirely and this lane would stay
# green. Its shape is not invented for the fixture: a `hooks.json` whose
# top-level `hooks` key holds an array of `{event, command, timeout}` objects
# rather than an object keyed by event name turned up in the third-party
# corpus. `matchers` rejects it at crates/claudevs/src/wiring/matchers.rs.
#
# `root` is deliberately relative: `claudevs check` resolves `plugin_dir` to
# an absolute path once, up front, and uses that single value for both the
# spawned delegate's argv and its cwd (crates/claudevs/src/validate.rs), so a
# relative path here is no longer doubled. Keeping it relative means that on
# a machine that has `claude`, this lane also exercises the delegate's path
# handling, so that defect cannot come back unnoticed.
script_runner = "@shell"
script = '''
set -e
root="crates/claudevs/tests/fixtures"

# `cargo run -q -p claudevs-cli --` in place of a hardcoded `target/debug/claudevs`
# path: cargo resolves the target directory itself, so the lane still works under
# CARGO_TARGET_DIR or a --target-dir override. `-q` suppresses cargo's own build
# output, so the captured output below is exactly what `claudevs check` printed.
#
# `_run` captures output and exit code and asserts the exit code, but is
# private (leading underscore, never called from the fixture list below) so
# that the stage assertion always runs in the same breath as the capture —
# there is no exposed "run" step whose output an assertion could read stale
# after a previous fixture, because there is no way to call one without the
# other.
_run() {
    plugin="$1"; want_exit="$2"
    set +e
    out="$(cargo run -q -p claudevs-cli -- check "$root/$plugin" 2>&1)"
    got=$?
    set -e
    if [ "$got" != "$want_exit" ]; then
        echo "claudevs check $plugin: expected exit $want_exit, got $got" >&2
        echo "$out" >&2
        exit 1
    fi
}

# Asserting exit codes alone cannot tell which stage produced them: a
# regression that fails the wiring check for the wrong reason, or that moves a
# failure from wiring to validate, keeps exit 1 and this lane would stay
# green. So beyond the exit code, assert which stage line `claudevs check`
# printed.

# `claudevs check` indents every top-level stage line by two spaces (`  ok
# validate`, `  FAIL  wiring`), so the assertions below match on that exact
# prefix rather than column zero.
#
# Each fixture calls exactly one of the three functions below, and each one
# runs `_run` itself before reading `$out`/`$got` — the two can no longer be
# invoked separately, so there is no way to assert against a previous
# fixture's stale output.
expect_no_fail() {
    plugin="$1"; want_exit="$2"
    _run "$plugin" "$want_exit"
    if echo "$out" | grep -q "^  FAIL  "; then
        echo "claudevs check $plugin: expected every stage to pass, but a stage reported FAIL:" >&2
        echo "$out" >&2
        exit 1
    fi
    # The absence check above cannot tell "every stage passed" from "no stage
    # line was printed at all" — a silently-broken binary that exits 0 with no
    # output would sail through it. `wiring` is the positive anchor because it
    # runs on every machine regardless of whether the `claude` binary is
    # installed (unlike `validate`, which skips when `claude` is absent), so
    # asserting its exact line pins that a stage was actually produced without
    # reintroducing any machine dependence.
    if ! echo "$out" | grep -q "^  ok    wiring\$"; then
        echo "claudevs check $plugin: expected \"ok    wiring\" among the stage lines, got:" >&2
        echo "$out" >&2
        exit 1
    fi
    echo "ok  $plugin (exit $got, no stage failed)"
}

expect_stage_fail() {
    plugin="$1"; want_exit="$2"; stage="$3"
    _run "$plugin" "$want_exit"
    if ! echo "$out" | grep -q "^  FAIL  $stage\$"; then
        echo "claudevs check $plugin: expected \"FAIL  $stage\", got:" >&2
        echo "$out" >&2
        exit 1
    fi
    echo "ok  $plugin (FAIL $stage)"
}

# bad-matcher-plugin and hooks-array-plugin FAIL at wiring on every machine:
# the wiring checkers are native and run whether or not `claude` is installed.
# Where `claude` IS installed, validate passes bad-matcher-plugin (its unknown
# event is a warning) and still fails hooks-array-plugin, whose top-level
# `hooks` is an array rather than an object. `expect_stage_fail` greps for its
# own stage's line rather than requiring it to be the only FAIL, so pinning
# `wiring` here holds in both environments — and, unlike accepting "validate
# or wiring", it still fails this lane if a wiring checker stops reporting.

expect_no_fail minimal-plugin 0
expect_no_fail dead-script-plugin 0
expect_stage_fail escape-plugin 1 wiring
expect_stage_fail bad-matcher-plugin 1 wiring
expect_stage_fail hooks-array-plugin 1 wiring

# project-branch-plugin is the paired control for the default project: its
# one PreToolUse hook only speaks when the payload names a file that exists
# inside a project carrying a manifest, which is exactly what the default
# fixtureless project (Project::empty()) now provides. A bare temp directory
# would take the hook's silent branch and this case would pass whether the
# hook worked or not.
expect_no_fail project-branch-plugin 0

# exec-args-plugin is the paired control for `args`-carrying exec handlers: one
# SessionStart case whose output comes from `command`, one whose output comes
# only from `args`. Both must pass, or the exec dispatch path has regressed.
expect_no_fail exec-args-plugin 0

# matcher-routing-plugin is a must-fail fixture on purpose: its two PreToolUse
# cases target different matcher groups, and the second asserts the `Edit`
# group's output against a `Bash` payload — a case the runtime would never
# route there. It FAILs at `test` (and `test --installed`, for the same
# reason): both stages actually run the case suite, unlike `wiring`, which is
# static and cannot see a payload/matcher mismatch. A corpus of only-passing
# fixtures would go green the day this routing check stopped reporting.
expect_stage_fail matcher-routing-plugin 1 test
'''

[tasks.corpus-fetch]
category = "Claudevs"
description = "Clone the pinned third-party plugin corpus into target/corpus"
# Clones third-party repositories over the network (`deny` also fetches the
# advisory database). It is never a dependency of `dod`, never runs in CI, and is run before a release rather
# than on every commit — the corpus is pinned by commit SHA rather than
# vendored, which keeps repository weight at zero (vendoring measured 19 MB
# for all 156 roots) and keeps the published .crate clear of the crates.io
# size ceiling. The cost of that choice is exactly this: a check nobody is
# obliged to run guards by convention.
#
# A pinned SHA is re-fetchable while the commit stays reachable. A repository
# that is deleted, made private, or force-pushed makes its row a record of
# what was tested rather than something re-runnable. That is expected; report
# such a row as unfetchable rather than repinning it silently.
#
# The body is a file, not an inline script, so that its malformed-record guard
# — the one standing between a shifted manifest record and an `rm -rf` of the
# whole corpus root — can be pinned by an ordinary test. This lane is in
# neither `dod` nor CI, so a guard reachable only from here is a guard whose
# removal nothing would notice; `crates/claudevs/tests/fetch.rs` drives
# the script against its own scratch manifests under `cargo test`. The script
# takes the manifest and the destination as optional arguments and defaults
# both to the values this lane wants, which is why none are passed here.
command = "./scripts/corpus-fetch.sh"

[tasks.corpus-check]
category = "Claudevs"
description = "Sweep the fetched third-party corpus and check it is not short (slow; needs corpus-fetch)"
# Not a dependency of `dod` and not in CI, for the reason the corpus is
# pinned rather than vendored: the clones are not in the repository, so this
# lane cannot run on a checkout alone. It is run before a release.
#
# This is the second corpus, not a replacement for the first.
# `cargo make claudevs-check` runs the hand-authored fixtures in
# crates/claudevs/tests/fixtures/ in both directions and stays exactly as it
# is: those fixtures pin the behaviour claudevs intends, and they are cheap
# and unskippable. This one answers the different question — whether that
# intent survives contact with plugins nobody here wrote.
#
# This lane would run a corpus plugin's case suite if one shipped a case file —
# Lua confined, a declared native suite through an unconfined shell. None of the
# 13 pinned repositories carries one today, so no third-party code runs. The
# module doc in crates/claudevs/tests/corpus.rs carries the detail.
#
# A mistyped package or test-target name here is not a silent pass: cargo
# rejects both outright, exit 101 —
#   error: package ID specification `claudevs-nonexistent` did not match any packages
#   error: no test target named `nonexistent` in `claudevs` package
# What does exit 0 having run nothing is a NAME FILTER that matches no test:
# appending an unmatched filter to the args below prints "running 0 tests ...
# 0 passed; 0 failed; 0 ignored; 0 measured; 4 filtered out" and exits 0, and
# no flag turns that into a failure.
#
# The real silent-pass path, though, is a corpus that is absent or short
# rather than a mistyped target: the sweep renders one row per manifest root
# whether or not the clone behind it exists, so nothing cloned would still
# produce a full-length report. Three guards in tests/corpus.rs carry that
# weight — the corpus-root helper asserts `target/corpus` is a directory at
# all; the sweep requires every repository carrying a plugin root to have
# either a checkout on disk or a slug recorded in `corpus-fetch`'s
# `.unfetchable` marker; and it fails any root that renders ABSENT while its
# repository *is* checked out, which is a wrong pin or a moved plugin path
# rather than an unreachable upstream.
command = "cargo"
args = ["test", "-p", "claudevs", "--test", "corpus", "--", "--ignored", "--nocapture"]

# ---------------------------------------------------------------------------
# OpenCode
# ---------------------------------------------------------------------------

[tasks.opencode-check]
category = "OpenCode"
description = "Run the opencode extension inside the pinned real OpenCode (downloads it into target/)"
# Not a dependency of `dod`, like `claudevs-check`: it needs Node and a download,
# and CI runs it as its own job. The mock model and the scenarios are under
# crates/agentstacks-cli/tests/opencode-check/.
#
# The OpenCode build is pinned by version and by the SHA256 of each platform's
# archive, which is verified on every run. Bumping OpenCode changes the version
# (VERSION, the download URL and the directory under target/) and both hashes
# together.
script_runner = "@shell"
script = '''
set -e
VERSION=2.4.1
os=$(uname -s)
arch=$(uname -m)
case "$os $arch" in
  "Linux x86_64")
    asset=opencode-linux-x64.tar.gz
    sha=9ddd18e3faf64eaeccf6a0fcbc96a5c7a14520ae5fd5b61e5be51d894f478b47
    ;;
  "Darwin arm64")
    asset=opencode-darwin-arm64.zip
    sha=95a101eda95108478f1db43cff8fcbd4811f6c0e79af1e167301843c6a48d731
    ;;
  *)
    echo "opencode-check: no pinned OpenCode build for $os $arch" >&2
    exit 1
    ;;
esac

dir="target/opencode-check/$VERSION"
archive="$dir/$asset"
mkdir -p "$dir"
if [ ! -f "$archive" ]; then
  curl -sSfL -o "$archive" \
    "https://github.com/anomalyco/opencode/releases/download/v$VERSION/$asset"
fi
# The archive is checked on every run, so a kept file that changed is refused
# too; the binary that runs is always extracted from the archive that passed.
if command -v sha256sum >/dev/null 2>&1; then
  got=$(sha256sum "$archive" | cut -d ' ' -f 1)
else
  got=$(shasum -a 256 "$archive" | cut -d ' ' -f 1)
fi
if [ "$got" != "$sha" ]; then
  rm -f "$archive"
  echo "opencode-check: $asset: checksum mismatch" >&2
  exit 1
fi
rm -rf "$dir/bin"
mkdir -p "$dir/bin"
case "$asset" in
  *.tar.gz) tar -xzf "$archive" -C "$dir/bin" ;;
  *.zip) unzip -o -q "$archive" -d "$dir/bin" ;;
esac
if [ ! -x "$dir/bin/opencode" ]; then
  echo "opencode-check: $asset: no opencode binary inside" >&2
  exit 1
fi

cargo build -p agentstacks-cli
node crates/agentstacks-cli/tests/opencode-check/check.mjs "$dir/bin/opencode" target/debug/agentstacks
'''

# ---------------------------------------------------------------------------
# Muse Code
# ---------------------------------------------------------------------------

[tasks.musecode-check]
category = "Muse Code"
description = "Run the musecode extension inside the pinned real Muse Code (downloads it into target/)"
# Not a dependency of `dod`, like `opencode-check`: it needs Node and a download,
# and CI runs it as its own job. The mock model and the scenarios are under
# crates/agentstacks-cli/tests/musecode-check/.
#
# The Muse Code build is pinned by version and by the SHA256 of each platform's
# raw binary, which is verified on every run. Bumping Muse Code changes the
# version (VERSION, the download URL and the directory under target/) and both
# hashes together, plus the cache path and key of the `musecode-check` job in
# .github/workflows/ci.yml.
script_runner = "@shell"
script = '''
set -e
VERSION=1.4.25-R9361.1
os=$(uname -s)
arch=$(uname -m)
case "$os $arch" in
  "Linux x86_64")
    file=muse-x86-linux
    sha=c1b728fb9732503c5e1869e3ad2f2c9bdb5b2638fb4cf398d6e2c46aa6d8f94a
    ;;
  "Darwin arm64")
    file=muse-aarch64-macos
    sha=d8faeec8b3a2507125d97f1a79ae18781d254e8cd376f26531587fb6e043c27d
    ;;
  *)
    echo "musecode-check: no pinned Muse Code build for $os $arch" >&2
    exit 1
    ;;
esac

dir="target/musecode-check/$VERSION"
muse="$dir/muse"
mkdir -p "$dir"

# verify <path>: the binary is checked on every run, so a partial download or a
# kept file that changed is refused too. A mismatch removes the file, prints
# the refusal and returns 1.
verify() {
  if command -v sha256sum >/dev/null 2>&1; then
    got=$(sha256sum "$1" | cut -d ' ' -f 1)
  else
    got=$(shasum -a 256 "$1" | cut -d ' ' -f 1)
  fi
  if [ "$got" != "$sha" ]; then
    rm -f "$1"
    echo "musecode-check: $file: checksum mismatch" >&2
    return 1
  fi
}

# The verify self-test, offline and before the real run: a truncated copy of
# the binary (a stub when none is kept yet) must be refused with the mismatch
# message and exit 1, and must be removed.
probe=$(mktemp "${TMPDIR:-/tmp}/musecode-check.XXXXXX")
trap 'rm -f "$probe"' EXIT
if [ -f "$muse" ]; then
  head -c 4096 "$muse" > "$probe"
else
  printf 'partial' > "$probe"
fi
# Tracing is switched off silently inside the capture: when the runner traces the
# script (as CI's does), the trace lines would land in $msg.
msg=$({ set +x; } 2>/dev/null; verify "$probe" 2>&1) && code=0 || code=$?
if [ "$code" != 1 ] || [ "$msg" != "musecode-check: $file: checksum mismatch" ] || [ -e "$probe" ]; then
  echo "musecode-check: verify self-test failed: want exit 1, the mismatch message and the file removed; got exit $code, '$msg'" >&2
  exit 1
fi
echo "musecode-check: verify self-test passed"

if [ ! -f "$muse" ]; then
  if ! curl -fsSL -o "$muse" \
    "https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version=$VERSION&file=$file"; then
    rm -f "$muse"
    echo "musecode-check: $file: download failed" >&2
    exit 1
  fi
fi
verify "$muse" || exit 1
chmod +x "$muse"

cargo build -p agentstacks-cli
node crates/agentstacks-cli/tests/musecode-check/check.mjs "$muse" target/debug/agentstacks
'''

# ---------------------------------------------------------------------------
# Supply chain
# ---------------------------------------------------------------------------

[tasks.deny]
category = "Supply chain"
description = "cargo-deny: security advisories, licenses, duplicate versions, sources"
# Deliberately not a dependency of `dod`. The Definition of Done is the five
# commands the guideline skill owns plus the project's `lua` step; adding
# another here would make this file disagree with its source of truth. This
# check also answers to a moving advisory database rather than to the working
# tree, so it can fail on a commit that changed nothing.
command = "cargo"
args = ["deny", "check"]

# ---------------------------------------------------------------------------
# Book
# ---------------------------------------------------------------------------

# `book` and `book-build` install mdBook and mdbook-mermaid on first use rather than failing
# with a missing binary. The versions are exact, not floors: mdbook-mermaid
# 0.17 needs mdBook 0.5, so a floor would install a pair that cannot build the
# book. The same two versions are pinned in ci.yml's `book` job and in
# pages.yml; change all three together. The output lands in `book/book/`,
# which is ignored — the published copy is built by the Pages workflow.
#
# Each install task asks the binary on PATH for its version. cargo-make's
# `install_crate` is not used: it reads the version from cargo's install
# record, so it accepts a binary of another version found first on PATH. When
# that binary is still not the pinned version after installing, the task fails
# and names it rather than build with the wrong one.

[tasks.book-mdbook]
category = "Book"
description = "Install mdBook 0.4.52 unless that version is the one on PATH"
script_runner = "@shell"
script = '''
case "$(mdbook --version 2>/dev/null)" in
    "mdbook v0.4.52") ;;
    *) cargo install mdbook --version 0.4.52 --locked --force ;;
esac
if [ "$(mdbook --version 2>/dev/null)" != "mdbook v0.4.52" ]; then
    echo "mdbook on PATH is $(command -v mdbook), not v0.4.52; put ~/.cargo/bin first" >&2
    exit 1
fi
'''

[tasks.book-mermaid]
category = "Book"
description = "Install mdbook-mermaid 0.16.2, which draws the book's diagrams, unless that version is the one on PATH"
script_runner = "@shell"
script = '''
case "$(mdbook-mermaid --version 2>/dev/null)" in
    "mdbook-mermaid 0.16.2") ;;
    *) cargo install mdbook-mermaid --version 0.16.2 --locked --force ;;
esac
if [ "$(mdbook-mermaid --version 2>/dev/null)" != "mdbook-mermaid 0.16.2" ]; then
    echo "mdbook-mermaid on PATH is $(command -v mdbook-mermaid), not 0.16.2; put ~/.cargo/bin first" >&2
    exit 1
fi
'''

[tasks.book]
category = "Book"
description = "Serve the book at http://localhost:3000, rebuilding on every edit"
dependencies = ["book-mdbook", "book-mermaid"]
command = "mdbook"
args = ["serve", "book", "--open"]

[tasks.book-build]
category = "Book"
description = "Build the book once into book/book/, the same build Pages publishes"
dependencies = ["book-mdbook", "book-mermaid"]
command = "mdbook"
args = ["build", "book"]

# ---------------------------------------------------------------------------
# Development helpers
# ---------------------------------------------------------------------------

[tasks.fmt]
category = "Development"
description = "Rewrite formatting in place"
command = "cargo"
args = ["fmt", "--all"]

[tasks.clippy-fix]
category = "Development"
description = "Apply the clippy suggestions that are machine-applicable"
command = "cargo"
args = [
  "clippy",
  "--workspace",
  "--all-targets",
  "--all-features",
  "--fix",
  "--allow-dirty",
]

[tasks.dod-crate]
category = "Development"
description = "The gate scoped to one crate: cargo make dod-crate agentstacks"
# While developing a single-crate change, `-p <crate>` replaces `--workspace`.
# Cross-crate changes and pre-release runs use the unscoped `dod`.
script_runner = "@shell"
script = '''
crate="${1}"
if [ -z "${crate}" ]; then
    echo "usage: cargo make dod-crate <crate-name>" >&2
    exit 1
fi
set -x
cargo fmt -p "${crate}" -- --check
cargo clippy -p "${crate}" --all-targets --all-features -- -D warnings
RUSTDOCFLAGS="-D warnings" cargo doc -p "${crate}" --all-features --no-deps
cargo test -p "${crate}" --all-targets --all-features
# A binary-only crate has no library, so cargo refuses `--doc` for it; the
# workspace-wide `dod` skips such members the same way. Any other failure fails.
if ! out="$(cargo test -p "${crate}" --all-features --doc 2>&1)"; then
    if printf '%s\n' "${out}" | grep -q 'no library targets found'; then
        echo "dod-crate: ${crate} has no library target; no doctests to run"
    else
        printf '%s\n' "${out}" >&2
        exit 1
    fi
else
    printf '%s\n' "${out}"
fi
'''
