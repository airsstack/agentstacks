[package]
name                   = "agentstacks-cli"
version                = "0.2.0"
description            = "Sets up agentic coding tools from one tool-neutral copy of skills, agents, commands, hooks and rules."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true
readme                 = "README.md"
keywords               = ["agents", "claude-code", "cli", "lua", "setup"]
categories             = ["command-line-utilities", "development-tools"]

[[bin]]
name = "agentstacks"
path = "src/main.rs"
doc  = false

[lints]
workspace = true

[dependencies]
agentstacks = { workspace = true }
clap = { workspace = true }
similar = { workspace = true }

[dev-dependencies]
agentstacks = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
