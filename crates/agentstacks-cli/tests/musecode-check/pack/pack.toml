[pack]
name = "check"
version = "0.1.0"
api = 1
description = "Fixed inputs for the musecode-check run against a real Muse Code"

[requires]
airsl = ">=0.1.5"

[[hooks]]
kind = "message"
event = "session.start"
match = ["startup"]
text = "CHECK-WELCOME"

[[hooks]]
kind = "lua"
event = "session.start"
run = "hooks/start.lua"

[[hooks]]
kind = "lua"
event = "prompt.submit"
run = "hooks/prompt.lua"

[[hooks]]
kind = "lua"
event = "tool.before"
match = ["write"]
may_block = true
run = "hooks/before.lua"

[[hooks]]
kind = "lua"
event = "tool.after"
match = ["read"]
run = "hooks/after.lua"

[[hooks]]
kind = "message"
event = "session.end"
text = "CHECK-END"

[[hooks]]
kind = "lua"
event = "agent.stop"
agents = ["helper"]
run = "hooks/stop.lua"
