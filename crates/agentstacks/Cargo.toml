[package]
name                   = "agentstacks"
version                = "0.0.0"
description            = "Core library of agentstacks: packs, tool extensions, plans, and the executor that applies them."
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish.workspace      = true

[lints]
workspace = true

[features]
# Exposes the port fakes (`FakeWorkspace`, `FakeGit`, `FakeBinary`, `FakeAdapter`, `FakeFileTree`)
# to dependent crates' tests.
testing = []

[dependencies]
airsl = { workspace = true }
globset = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
