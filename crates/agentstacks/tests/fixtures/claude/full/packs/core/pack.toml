[pack]
name = "core"
version = "0.1.0"
api = 1
description = "A pack with every kind of item"

[requires]
airsl = ">=0.1.4"

# 0: a message on session start, with a quote and a newline in the text
[[hooks]]
kind = "message"
event = "session.start"
match = ["startup", "resume"]
text = "It's a \"test\"\nline two"

# 1: a message on session end, which Claude cannot show
[[hooks]]
kind = "message"
event = "session.end"
text = "Bye"

# 2: a lua hook that may block, with grants and a rendered argument
[[hooks]]
kind = "lua"
event = "tool.before"
match = ["read", "edit"]
run = "hooks/enforce.lua"
args = ["--manifest", "{{root}}/data.json"]
may_block = true
[hooks.grants]
policy = "confined"
read = ["{{root}}"]
write = ["{{var tmpdir}}"]
env = ["HOME"]

# 3: a hook that holds the session id var
[[hooks]]
kind = "lua"
event = "prompt.submit"
run = "hooks/enforce.lua"
args = ["--sid", "{{var session_id}}"]

# 4: a message on agent stop, which would keep the agent running
[[hooks]]
kind = "message"
event = "agent.stop"
text = "Keep going"

# 5: a lua hook with no match and an argument that expands a var
[[hooks]]
kind = "lua"
event = "tool.after"
run = "hooks/enforce.lua"
args = ["{{var tmpdir}}/x"]

# 6: a lua hook with a literal dollar in an argument
[[hooks]]
kind = "lua"
event = "agent.stop"
agents = ["coder"]
run = "hooks/enforce.lua"
args = ["^a$"]

# 7: a lua hook on agent stop that lists an agent, matched by its installed name
[[hooks]]
kind = "lua"
event = "agent.stop"
agents = ["coder"]
run = "hooks/enforce.lua"
