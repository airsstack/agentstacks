[pack]
name = "full"
version = "0.1.0"
api = 0
description = "A pack with every kind of file item"

[requires]
airsl = ">=0.1.4"

# 0: a message on session start for a new session
[[hooks]]
kind = "message"
event = "session.start"
match = ["startup"]
text = "It's a \"test\"\nline two"

# 1: a lua hook that matches only a compacted session, which opencode never starts
[[hooks]]
kind = "lua"
event = "session.start"
match = ["compact"]
run = "hooks/enforce.lua"

# 2: a lua hook on session start with no match
[[hooks]]
kind = "lua"
event = "session.start"
run = "hooks/enforce.lua"

# 3: a lua hook on prompt submit with an argument that expands a var
[[hooks]]
kind = "lua"
event = "prompt.submit"
run = "hooks/enforce.lua"
args = ["{{var tmpdir}}/x"]

# 4: a lua hook that may block, matching write
[[hooks]]
kind = "lua"
event = "tool.before"
match = ["write"]
run = "hooks/enforce.lua"
args = ["--strict"]
may_block = true

# 5: a lua hook with no match
[[hooks]]
kind = "lua"
event = "tool.after"
run = "hooks/enforce.lua"

# 6: a message on session end, which opencode cannot run
[[hooks]]
kind = "message"
event = "session.end"
text = "Bye"

# 7: a lua hook on agent stop, which opencode cannot run
[[hooks]]
kind = "lua"
event = "agent.stop"
agents = ["coder"]
run = "hooks/enforce.lua"

# 8: a lua hook with a literal dollar in an argument
[[hooks]]
kind = "lua"
event = "prompt.submit"
run = "hooks/enforce.lua"
args = ["^a$"]
