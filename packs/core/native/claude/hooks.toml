[[hooks]]
kind      = "lua"
event     = "PreToolUse"
match     = ["^SubagentHandback$"]
run       = "scripts/handoff_check_hook.lua"
may_block = true
[hooks.grants]
env  = ["HOME", "TMPDIR"]
read = ["/"]

